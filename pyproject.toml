[project]
name = "fluxo-agentico-mcp-b3"
version = "0.1.0"
description = "Consultor financeiro Quantum Finance: agentes LangGraph + BFA (Backend For Agents) sobre o bolsai-mcp"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.27,<2",  # bolsai-mcp 0.1.1 usa FastMCP (removido no mcp 2.x)
    "httpx>=0.28",
    "pydantic>=2.12",
    "pydantic-settings>=2.5",
    "cachetools>=5.5",
    "python-dotenv>=1.0",
    "langchain>=1.2",
    "langchain-core>=1.2",
    "langchain-openai>=1.1",
    "langchain-community>=0.4",
    "langgraph>=1.1",
    "ddgs>=9.0",
    "duckduckgo-search>=8.1",
    "ipykernel",
    "pywin32; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["bfa", "agent"]
